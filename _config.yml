title: Mawchu's blog
subtitle: 貓奴前端 | 毛球的技術筆記
description: 我是毛球 (Mawchu)，半路從資深平面設計師轉職前端工程師的技術學習筆記，希望能透過平易近人的解釋幫助到任何一個迷途羔羊與我自己。
keywords: >-
  mawchu、貓奴前端、毛球、謝佳芳、轉職前端工程師、前端、網頁技術、Javascript、Vue、React、React思維進化、平面設計、frontend。
author: Mawchu
language: en
timezone: ''
url: https://mawchu.github.io/blog/
permalink: ':year/:month/:day/:title/'
permalink_defaults: null
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: docs
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render: null
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''
index_generator:
  path: ''
  per_page: 10
  order_by: '-date'
default_category: uncategorized
category_map: null
tag_map: null
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include: null
exclude: null
ignore: null
plugins: hexo-generator-feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
sitemap:
  path:
    - sitemap.xml
    - sitemap.txt
  template: ./source/layouts/sitemap_template.xml
  template_txt: ./source/layouts/sitemap_template.txt
  rel: false
  tags: true
  categories: true
social:
  RSS: /atom.xml || fa fa-rss
theme: next
deploy:
  type: git
  repo: https://${GIT_DEPLOY_KEY}@github.com/mawchu/blog.git
  branch: gh-pages
